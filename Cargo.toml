[package]
name = "tunnelx"
version = "0.1.0"
edition = "2021"
description = "Self-hosted Cloudflare Tunnel alternative - Edge + Agent in one binary"
license = "MIT"
repository = "https://github.com/evecus/tunnelx"
readme = "README.md"
keywords = ["tunnel", "proxy", "quic", "cloudflare", "nat"]
categories = ["network-programming", "command-line-utilities"]
rust-version = "1.80"

[[bin]]
name = "tunnelx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"

axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
futures = "0.3"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
dashmap = "6"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
